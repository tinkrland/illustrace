<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>illustrace composer</title>
<style>
  :root {
    --bg: #14130f; --panel: #1c1a15; --card: #22201a; --line: #35321f;
    --ink: #e8e4d4; --dim: #8f8a75; --faint: #5d594a;
    --accent: #d9a441; --accent2: #7fa06a; --edge: #6a6148;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink);
         font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--card);
           border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
           cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #14130f; border-color: var(--accent); }

  /* layout */
  #top { height: 46px; display: flex; align-items: center; gap: 10px;
         padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #top h1 { font-size: 13px; font-weight: normal; color: var(--dim); letter-spacing: .5px; }
  #top .spacer { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: transparent; padding: 5px 14px; }
  .seg button.on { background: var(--accent); color: #14130f; }
  #main { display: flex; height: calc(100vh - 46px); }
  #stage { flex: 1; position: relative; overflow: hidden; background:
           radial-gradient(circle at 1px 1px, #26231c 1px, transparent 1px) 0 0/24px 24px; }
  #right { width: 250px; border-left: 1px solid var(--line); background: var(--panel);
           padding: 12px; overflow-y: auto; }

  /* canvas nodes */
  .node { position: absolute; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; width: 172px; user-select: none; }
  .node .hd { padding: 7px 10px 5px; font-size: 11px; color: var(--dim);
              letter-spacing: .5px; display: flex; justify-content: space-between; }
  .node .hd b { color: var(--ink); font-weight: normal; }
  .node.inspo { width: 188px; }
  .node.inspo .th { width: 100%; height: 74px; object-fit: cover; display: block;
                    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
                    background: #000; }
  .node.inspo .sw { display: flex; height: 8px; }
  .node.inspo .sw i { flex: 1; }
  .node .ft { padding: 6px 10px 8px; font-size: 10px; color: var(--faint); }
  .port { position: absolute; top: 26px; width: 11px; height: 11px; border-radius: 50%;
          background: var(--edge); border: 2px solid var(--bg); cursor: crosshair; z-index: 2; }
  .port.out { right: -6px; } .port.in { left: -6px; }
  .port:hover, .port.lit { background: var(--accent); }
  .node.comp { border-color: var(--edge); }
  .node.comp .roles { padding: 0 10px 8px; font-size: 10px; }
  .role { display: flex; align-items: center; gap: 6px; padding: 2px 0; color: var(--dim); }
  .role .bar { height: 4px; background: var(--accent); border-radius: 2px; opacity: .85; }
  .role .win { color: var(--accent2); }
  .node.win .hd .badgew { color: var(--accent2); }
  .node.sel { border-color: var(--accent); }
  .merged { padding: 6px 10px 10px; border-top: 1px dashed var(--line); }
  .merged .mpal { display: flex; height: 12px; border-radius: 3px; overflow: hidden; }
  .merged .mpal i { flex: 1; }
  .merged .mstat { font-size: 10px; color: var(--dim); padding-top: 5px; }
  .dup { position: absolute; right: 8px; top: 6px; font-size: 9px; color: var(--faint); }

  /* svg edges */
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #wires path.edge { stroke: var(--edge); stroke-width: 2.4; fill: none; pointer-events: stroke; cursor: pointer; }
  #wires path.edge.sel { stroke: var(--accent); }
  #wires path.temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 4; }
  #wires text { fill: var(--dim); font: 9px ui-monospace, monospace; }

  /* right panel */
  #right h3 { font-size: 11px; font-weight: normal; color: var(--dim); margin: 14px 0 6px;
              text-transform: lowercase; letter-spacing: .5px; }
  #right h3:first-child { margin-top: 0; }
  .kv { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim);
        padding: 2px 0; }
  .kv b { color: var(--ink); font-weight: normal; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .hint { font-size: 10px; color: var(--faint); line-height: 1.5; }
  textarea { width: 100%; height: 190px; background: var(--card); color: var(--ink);
             border: 1px solid var(--line); border-radius: 6px; font: 10px ui-monospace, monospace;
             padding: 8px; resize: vertical; }
  #toasts { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 6px; z-index: 99; }
  .toast { background: var(--accent); color: #14130f; padding: 6px 14px; border-radius: 6px;
           font-size: 11px; animation: fade 2.6s forwards; }
  @keyframes fade { 0%,70% {opacity:1} 100% {opacity:0} }

  /* gravity view */
  #grav { position: absolute; inset: 0; overflow-y: auto; padding: 34px 22px 80px; display: none; }
  #grav h2 { font-size: 13px; font-weight: normal; color: var(--dim); margin-bottom: 3px; }
  #grav p { font-size: 11px; color: var(--faint); margin-bottom: 18px; max-width: 640px; }
  .grow { display: flex; align-items: center; gap: 12px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
          margin-bottom: 8px; cursor: grab; max-width: 680px; }
  .grow.ghost { opacity: .35; }
  .grow .rank { width: 30px; height: 30px; border-radius: 50%; background: var(--line);
                display: flex; align-items: center; justify-content: center; font-size: 12px;
                color: var(--dim); flex: none; }
  .grow:first-of-type .rank { background: var(--accent); color: #14130f; }
  .grow img { width: 46px; height: 34px; object-fit: cover; border-radius: 5px; flex: none; }
  .grow .gname { min-width: 74px; }
  .grow .gname .s { display: block; font-size: 9px; color: var(--faint); }
  .chips { flex: 1; display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 10px; padding: 3px 8px; border-radius: 12px; background: var(--panel);
          border: 1px solid var(--line); color: var(--dim); }
  .chip b { color: var(--ink); font-weight: normal; }
  .chip.w { border-color: var(--accent2); color: var(--accent2); }
  #pool { margin-top: 26px; }
  #pool .grow { opacity: .6; }
  #emptyg { color: var(--faint); font-size: 11px; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div id="top">
  <h1>illustrace composer</h1>
  <div class="seg">
    <button id="bt-canvas" class="on" onclick="setView('canvas')">canvas</button>
    <button id="bt-grav" onclick="setView('gravity')">gravity</button>
  </div>
  <div class="spacer"></div>
  <input id="pname" placeholder="preset name" style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;width:130px">
  <button onclick="savePreset()">save</button>
  <select id="pload" onchange="loadPreset(this.value)" style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit">
    <option value="">saved...</option>
  </select>
</div>
<div id="main">
  <div id="stage">
    <svg id="wires"></svg>
    <div id="grav">
      <h2>gravity</h2>
      <p>drag rows to set the importance hierarchy. strength says how much you take; gravity says whose direction wins when two inspirations pull the same component. the top-ranked one always wins the conflict, even at a lower percentage.</p>
      <div id="glist"></div>
      <div id="pool"></div>
    </div>
  </div>
  <div id="right"></div>
</div>
<div id="toasts"></div>

/* storage that never crashes (file:// in some browsers, embedded contexts) */
const STORE = (() => {
  let mem = {};
  try { localStorage.setItem("_t", "1"); localStorage.removeItem("_t");
    return { get: k => localStorage.getItem(k), set: (k, v) => localStorage.setItem(k, v) };
  } catch (e) {
    return { get: k => mem[k] ?? null, set: (k, v) => { mem[k] = v; } };
  }
})();
/* ---------- state ---------- */
const COMPONENTS = [
  { id: "palette", label: "palette", take: "colors + value spread" },
  { id: "stroke",  label: "stroke",  take: "width, wobble, axis" },
  { id: "texture", label: "texture", take: "grain energy" },
  { id: "edges",   label: "edges",   take: "orientation entropy" },
  { id: "shape",   label: "contour", take: "density proxies" },
];
const IMGDIRS = {
  monet: "../../data/monet/", van_gogh: "../../data/van_gogh/",
  hokusai: "../../data/hokusai/",
};
function imgPath(f) {
  for (const k in IMGDIRS) if (f.startsWith(k + "_")) return IMGDIRS[k];
  return "../../data/test_images/";
}

let PROFS = DATA.profiles;
/* dedupe: identical measured vectors fold into the first occurrence */
const seen = new Map(), LIB = [], DUP = {};
for (const p of PROFS) {
  const sig = JSON.stringify(p.components);
  if (seen.has(sig)) { DUP[p.file] = seen.get(sig); }
  else { seen.set(sig, p.file); LIB.push(p); }
}

let S = {
  nodes: {}, edges: [], gravity: [], selEdge: null, view: "canvas",
  pan: { x: 0, y: 0 }, zoom: 1, name: ""
};
COMPONENTS.forEach((c, i) =>
  S.nodes["c_" + c.id] = { x: 640, y: 30 + i * 118 });
LIB.forEach((p, i) =>
  S.nodes[p.file] = { x: 60 + (i % 2) * 210, y: 40 + Math.floor(i / 2) * 158 });

const el = id => document.getElementById(id);
const stage = el("stage");

/* ---------- render: canvas ---------- */
function setView(v) {
  S.view = v;
  el("bt-canvas").classList.toggle("on", v === "canvas");
  el("bt-grav").classList.toggle("on", v === "gravity");
  el("grav").style.display = v === "gravity" ? "block" : "none";
  if (v === "gravity") renderGravity();
}

function nodeEl(p) {
  const d = document.createElement("div");
  d.className = "node inspo"; d.dataset.id = p.file;
  d.innerHTML =
    `<div class="hd"><b>${p.file}</b></div>` +
    `<img class="th" src="${imgPath(p.file) + p.file}" draggable="false">` +
    `<div class="sw">${p.components.palette.colors_hex.slice(0, 5).map(h => `<i style="background:${h}"></i>`).join("")}</div>` +
    `<div class="ft">w ${p.components.stroke.width_mean}px · cv ${p.components.stroke.width_cv} · tex ${p.components.texture.energy}</div>` +
    `<div class="port out" data-id="${p.file}"></div>` +
    (DUP[p.file] ? `<div class="dup">dup of ${DUP[p.file]}</div>` : "");
  return d;
}
function compEl(c) {
  const d = document.createElement("div");
  d.className = "node comp"; d.dataset.id = "c_" + c.id;
  d.innerHTML =
    `<div class="hd"><b>${c.label}</b><span class="badgew"></span></div>` +
    `<div class="roles" id="roles_${c.id}"></div>` +
    `<div class="merged" id="merged_${c.id}"></div>` +
    `<div class="port in" data-id="c_${c.id}"></div>`;
  return d;
}

function renderCanvas() {
  document.querySelectorAll(".node").forEach(n => n.remove());
  for (const p of LIB) stage.appendChild(nodeEl(p));
  for (const c of COMPONENTS) stage.appendChild(compEl(c));
  renderEdges(); renderRoles(); bindNodes();
}

function assign2comp(file, cid) {
  if (S.edges.some(e => e.inspo === file && e.component === cid)) return;
  S.edges.push({ id: "e" + Math.random().toString(36).slice(2, 8),
                 inspo: file, component: cid, strength: 70 });
  ensureGravity(file);
  renderEdges(); renderRoles(); renderGravity(); renderInspector();
}
function ensureGravity(file) {
  if (!S.gravity.includes(file)) S.gravity.push(file);
}
function removeEdge(id) {
  S.edges = S.edges.filter(e => e.id !== id);
  if (S.selEdge === id) S.selEdge = null;
  S.gravity = S.gravity.filter(f => S.edges.some(e => e.inspo === f));
  renderEdges(); renderRoles(); renderGravity(); renderInspector();
}

function portXY(id) {
  const n = stage.querySelector(`.node[data-id="${id}"]`);
  if (!n) return null;
  const p = n.querySelector(".port");
  const r = n.getBoundingClientRect(), pr = p.getBoundingClientRect();
  const sr = stage.getBoundingClientRect();
  const pt = { x: pr.left - sr.left + pr.width / 2,
               y: pr.top - sr.top + pr.height / 2 };
  return { x: pt.x / S.zoom - S.pan.x, y: pt.y / S.zoom - S.pan.y };
}
function edgePath(a, b) {
  const dx = Math.max(30, Math.abs(b.x - a.x) * .5);
  return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
}

function renderEdges() {
  const svg = el("wires");
  svg.innerHTML = "";
  svg.setAttribute("viewBox",
    `${S.pan.x} ${S.pan.y} ${stage.clientWidth / S.zoom} ${stage.clientHeight / S.zoom}`);
  for (const e of S.edges) {
    const a = portXY(e.inspo), b = portXY("c_" + e.component);
    if (!a || !b) continue;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", edgePath(a, b));
    path.setAttribute("class", "edge" + (S.selEdge === e.id ? " sel" : ""));
    path.dataset.id = e.id;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 8 };
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", mid.x); t.setAttribute("y", mid.y); t.textContent = e.strength + "%";
    svg.appendChild(path); svg.appendChild(t);
    path.addEventListener("pointerdown", ev => {
      ev.stopPropagation();
      S.selEdge = S.selEdge === e.id ? null : e.id;
      renderEdges(); renderInspector();
    });
  }
}

/* gravity: ordered candidates per component */
function candidates(cid) {
  return S.edges.filter(e => e.component === cid)
    .sort((a, b) => S.gravity.indexOf(a.inspo) - S.gravity.indexOf(b.inspo));
}
const DECAY = 0.65;

function merged(cid) {
  const cs = candidates(cid);
  if (!cs.length) return null;
  const winner = cs[0];
  const wp = LIB.find(p => p.file === winner.inspo).components;
  const out = { winner: winner.inspo, ws: cs.map(e => ({
    f: e.inspo, s: e.strength,
    w: +(e.strength / 100 * Math.pow(DECAY, cs.indexOf(e))).toFixed(3)
  })) };
  if (cid === "palette") {
    const slots = [];
    for (const e of cs) {
      const pal = LIB.find(p => p.file === e.inspo).components.palette.colors_hex;
      for (const h of pal) { if (slots.length < 6 && !slots.includes(h)) slots.push(h); }
    }
    out.colors = slots;
  } else if (cid === "stroke") {
    let w = 0, cv = 0, tw = 0;
    for (const x of out.ws) {
      const st = LIB.find(p => p.file === x.f).components.stroke;
      w += st.width_mean * x.w; cv += st.width_cv * x.w; tw += x.w;
    }
    out.stroke = { width_mean: +(w / (tw || 1)).toFixed(1),
                   width_cv: +(cv / (tw || 1)).toFixed(2) };
  } else if (cid === "texture") {
    let t = 0, tw = 0;
    for (const x of out.ws) {
      t += LIB.find(p => p.file === x.f).components.texture.energy * x.w; tw += x.w;
    }
    out.energy = +(t / (tw || 1)).toFixed(1);
  }
  return out;
}

function renderRoles() {
  for (const c of COMPONENTS) {
    const box = el("roles_" + c.id), m = merged(c.id);
    const cs = candidates(c.id);
    box.innerHTML = cs.map(e =>
      `<div class="role"><span style="width:64px;overflow:hidden;text-overflow:ellipsis">${e.inspo.replace(/\.[a-z]+$/, "")}</span>` +
      `<div class="bar" style="width:${e.strength * .8}px"></div>` +
      `<span>${e.strength}%${cs[0] === e ? ' <span class="win">▸</span>' : ""}</span></div>`).join("");
    const mg = el("merged_" + c.id);
    const hd = stage.querySelector(`.node[data-id="c_${c.id}"] .badgew`);
    if (!m) { mg.innerHTML = `<div class="mstat" style="color:var(--faint)">unassigned</div>`;
              if (hd) hd.textContent = ""; continue; }
    mg.innerHTML = (m.colors
        ? `<div class="mpal">${m.colors.map(h => `<i style="background:${h}"></i>`).join("")}</div>`
        : `<div class="mpal" style="height:12px"></div>`) +
      `<div class="mstat">${m.stroke ? `w ${m.stroke.width_mean}px · cv ${m.stroke.width_cv}` : ""}
        ${m.energy != null ? `energy ${m.energy}` : ""} · ${m.winner.replace(/\.[a-z]+$/, "")} leads</div>`;
    if (hd) hd.textContent = cs.length > 1 ? "▾" : "";
  }
}

/* ---------- node dragging + wiring ---------- */
function bindNodes() {
  stage.querySelectorAll(".node").forEach(n => {
    n.addEventListener("pointerdown", ev => {
      if (ev.target.classList.contains("port")) return;
      dragNode(n, ev);
    });
  });
  stage.querySelectorAll(".port.out").forEach(p => {
    p.addEventListener("pointerdown", ev => { ev.stopPropagation(); wire(p.dataset.id, ev); });
  });

}
let WIRE = null;
function wire(from, ev) {
  WIRE = { from };
  ev.target.classList.add("lit");
  showPick(COMPONENTS.map(c => c.id));
}
function showPick(opts) {
  /* tiny non-blocking picker anchored near cursor */
  const old = el("pickr"); if (old) old.remove();
  const d = document.createElement("div");
  d.id = "pickr";
  d.style.cssText = `position:fixed;z-index:98;left:${innerWidth/2-70}px;top:70px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;width:140px`;
  for (const o of opts) {
    const b = document.createElement("button");
    b.textContent = o; b.style.cssText = "display:block;width:100%;margin:2px 0;text-align:left";
    b.onclick = () => {
      d.remove();
      if (WIRE && WIRE.from) assign2comp(WIRE.from, o);
      clearWire();
    };
    d.appendChild(b);
  }
  document.body.appendChild(d);
  const rm = () => { d.remove(); };
  setTimeout(() => document.addEventListener("pointerdown", rm, { once: true }), 50);
  return null;
}
function clearWire() {
  document.querySelectorAll(".port").forEach(p => p.classList.remove("lit"));
  const d = el("pickr"); if (d) d.remove();
  WIRE = null;
}

function dragNode(n, ev) {
  const id = n.dataset.id;
  n.setPointerCapture(ev.pointerId);
  n.style.zIndex = 5;
  const sx = ev.clientX, sy = ev.clientY, ox = S.nodes[id].x, oy = S.nodes[id].y;
  const move = m => {
    S.nodes[id].x = ox + (m.clientX - sx) / S.zoom;
    S.nodes[id].y = oy + (m.clientY - sy) / S.zoom;
    place(n); renderEdges();
  };
  const up = () => {
    n.removeEventListener("pointermove", move); n.removeEventListener("pointerup", up);
    n.style.zIndex = 1;
  };
  n.addEventListener("pointermove", move); n.addEventListener("pointerup", up);
}
function place(n) {
  const p = S.nodes[n.dataset.id];
  n.style.transform =
    `translate(${(p.x + S.pan.x) * S.zoom}px, ${(p.y + S.pan.y) * S.zoom}px) scale(${S.zoom})`;
  n.style.transformOrigin = "0 0";
}

/* ---------- gravity view ---------- */
function renderGravity() {
  const list = el("glist"), pool = el("pool");
  if (S.gravity.length === 0) {
    list.innerHTML = `<div id="emptyg">no assignments yet — connect an inspiration to a component on the canvas</div>`;
    pool.innerHTML = ""; return;
  }
  list.innerHTML = ""; pool.innerHTML = "";
  S.gravity.forEach((f, i) => list.appendChild(growEl(f, i)));
  const un = LIB.map(p => p.file).filter(f => !S.gravity.includes(f));
  if (un.length) {
    const h = document.createElement("h3");
    h.textContent = "unassigned · " + un.length; h.style.cssText = "color:var(--faint);font-size:11px;font-weight:normal;margin:18px 0 6px";
    pool.appendChild(h);
    un.forEach(f => {
      const g = growEl(f, -1); g.style.opacity = .5; pool.appendChild(g);
    });
  }
  renderRoles();
}
function growEl(f, i) {
  const p = LIB.find(x => x.file === f);
  const d = document.createElement("div");
  d.className = "grow"; d.dataset.file = f;
  const wins = COMPONENTS.filter(c => merged(c.id)?.winner === f);
  const chips = S.edges.filter(e => e.inspo === f).map(e => {
    const w = candidates(e.component)[0]?.inspo === f;
    return `<span class="chip ${w ? "w" : ""}">${e.component} <b>${e.strength}%</b>${w ? " · wins" : ""}</span>`;
  }).join("");
  d.innerHTML =
    `<div class="rank">${i < 0 ? "–" : i + 1}</div>` +
    `<img src="${imgPath(f) + f}" draggable="false">` +
    `<div class="gname">${f.replace(/\.[a-z]+$/, "")}<span class="s">w ${p.components.stroke.width_mean}px · tex ${p.components.texture.energy}</span></div>` +
    `<div class="chips">${chips || '<span class="chip">unassigned</span>'}</div>`;
  if (i >= 0) d.addEventListener("pointerdown", gDrag);
  return d;
}
function gDrag(ev) {
  if (ev.button !== 0) return;
  const row = ev.currentTarget, f = row.dataset.file;
  const rows = [...el("glist").children];
  const sy = ev.clientY;
  row.classList.add("ghost"); row.setPointerCapture(ev.pointerId);
  const move = m => {
    const dy = m.clientY - sy;
    const idx = Math.min(rows.length - 1, Math.max(0,
      S.gravity.indexOf(f) + Math.round(dy / (row.offsetHeight + 8))));
    if (S.gravity.indexOf(f) !== idx) {
      S.gravity.splice(S.gravity.indexOf(f), 1);
      S.gravity.splice(idx, 0, f);
      renderGravity();
      const nr = [...el("glist").children].find(r => r.dataset.file === f);
      nr.classList.add("ghost"); nr.setPointerCapture(ev.pointerId);
    }
  };
  const up = () => {
    row.classList.remove("ghost");
    row.removeEventListener("pointermove", move);
    row.removeEventListener("pointerup", up);
    renderGravity(); renderEdges(); renderRoles(); updatePjson();
  };
  row.addEventListener("pointermove", move); row.addEventListener("pointerup", up);
}

/* ---------- inspector / preset ---------- */
function renderInspector() {
  const R = el("right");
  const e = S.edges.find(x => x.id === S.selEdge);
  let body = `<h3>assignment</h3>`;
  if (e) {
    body += `<div class="kv"><span>inspo</span><b>${e.inspo.replace(/\.[a-z]+$/, "")}</b></div>
      <div class="kv"><span>component</span><b>${e.component}</b></div>
      <div class="kv"><span>strength</span><b id="kv_str">${e.strength}%</b></div>
      <div style="margin:8px 0"><input type="range" min="0" max="100" value="${e.strength}"
        oninput="S.edges.find(x=>x.id==='${e.id}').strength=+this.value;renderEdges();renderRoles();renderGravity();el('kv_str').textContent=this.value+'%';updatePjson()"></div>
      <button onclick="removeEdge('${e.id}')">remove</button>`;
  } else {
    body += `<div class="hint">click a wire on the canvas to edit its strength, or drag from an inspo's right port to a component's left port to create one. click a component port to pick which slot the wire lands in.</div>`;
  }
  body += `<h3>preset json</h3><textarea id="pjson" readonly>${presetJson()}</textarea>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button onclick="copyJson()">copy</button>
      <button onclick="exportXano()">queue (xano)</button>
    </div>
    <h3>how taking works</h3>
    <div class="hint">strength = how much you take from that inspo for that component.<br><br>
    gravity = the hierarchy of who wins conflicts. the top-ranked inspo leads the component even at a lower strength; lower ranks blend in with decay ${DECAY}. toggle the gravity view to reorder.</div>`;
  R.innerHTML = body;
  refreshPresetList();
}
function presetJson() {
  const computed = {};
  for (const c of COMPONENTS) {
    const m = merged(c.id);
    if (m) computed[c.id] = m;
  }
  return JSON.stringify({
    name: el("pname").value || "untitled",
    version: 1,
    assignments: S.edges.map(e => ({ inspo: e.inspo, component: e.component, strength: e.strength })),
    gravity: S.gravity,
    computed
  }, null, 1);
}
function updatePjson() {
  const t = el("pjson");
  if (t) t.value = presetJson();
}
function copyJson() {
  navigator.clipboard?.writeText(el("pjson").value)
    .then(() => toast("copied"))
    .catch(() => toast("select and copy manually"));
}
function exportXano() {
  const p = JSON.parse(el("pjson").value);
  const body = { ...p, status: "queued" };
  fetch(XANO_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(r => r.ok ? toast("queued to xano") : toast("xano said " + r.status))
    .catch(() => toast("offline — copy instead"));
}
const XANO_URL = "https://xpnx-e4ie-cfuf.z7.xano.io/api:1yzI_vuYq/presets";

function savePreset() {
  const name = el("pname").value.trim() || "untitled";
  const all = JSON.parse(STORE.get("illustrace_presets") || "{}");
  all[name] = JSON.parse(el("pjson").value);
  STORE.set("illustrace_presets", JSON.stringify(all));
  refreshPresetList(); toast("saved " + name);
}
function refreshPresetList() {
  const sel = el("pload");
  const all = JSON.parse(STORE.get("illustrace_presets") || "{}");
  const cur = sel.value;
  sel.innerHTML = '<option value="">saved...</option>' +
    Object.keys(all).map(k => `<option${k === cur ? " selected" : ""}>${k}</option>`).join("");
}
function loadPreset(name) {
  if (!name) return;
  const all = JSON.parse(STORE.get("illustrace_presets") || "{}");
  const p = all[name]; if (!p) return;
  el("pname").value = p.name || name;
  S.edges = p.assignments.map((a, i) => ({ id: "e" + i, ...a }));
  S.gravity = p.gravity || [];
  renderEdges(); renderRoles(); renderGravity(); renderInspector();
  toast("loaded " + name);
  el("pload").value = "";
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  el("toasts").appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

/* ---------- boot ---------- */
function layout() {
  stage.querySelectorAll(".node").forEach(place);
  renderEdges();
}
stage.addEventListener("pointerdown", ev => {
  if (ev.target === stage && S.view === "canvas") {
    S.selEdge = null; renderEdges(); renderInspector();
  }
});
window.addEventListener("resize", () => { renderEdges(); });
window.addEventListener("pointerup", clearWire);

renderCanvas(); layout(); renderInspector();
</script>
</body>
</html>
